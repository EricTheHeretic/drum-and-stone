<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drum & Stone</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <a href="/">Drum &amp; Stone</a>
  <nav><a href="#goods">Goods</a><span class="menu">☰</span></nav>
</header>
<main>
  <img class="mark" id="logo" alt="Roasting drum on a stone cairn">
  <p class="place">SOUTH FORK, PENNSYLVANIA</p>
  <h1>Coffee, chocolate, and<br>food for the pack.</h1>
  <p class="lede">Roasted on a drum. Chocolate ground stone-fine.<br>Jerky, fruit, and noodles dried for the trail.</p>
  <a href="#goods"><img class="pine" id="pine" alt="See the goods"></a>
  <section class="grid" id="goods">
    <article class="card"><img id="coffee" alt=""><h3>ROASTED COFFEE</h3></article>
    <article class="card"><img id="cacao" alt=""><h3>BEAN-TO-BAR CHOCOLATE</h3></article>
    <article class="card"><img id="jerky" alt=""><h3>BEEF JERKY</h3></article>
    <article class="card"><img id="fruit" alt=""><h3>DRIED FRUIT</h3></article>
    <article class="card"><img id="noodles" alt=""><h3>DRY NOODLES</h3></article>
  </section>
</main>
<script>
const names = ["logo","pine","coffee","cacao","jerky","fruit","noodles"];
Promise.all(names.map(n => fetch("images/" + n + ".b64").then(r => r.text()).then(t => {
  document.getElementById(n).src = "data:image/png;base64," + t.trim();
})));
</script>
</body>
</html>
