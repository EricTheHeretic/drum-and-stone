<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drum and Stone</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<a class="logo" href="/" aria-label="Drum and Stone">
<svg viewBox="0 0 280 150" role="img">
<rect x="8" y="8" width="28" height="58" fill="#111"/>
<rect x="8" y="74" width="28" height="68" fill="#111"/>
<text x="52" y="52" font-family="Arial, Helvetica, sans-serif" font-size="36" letter-spacing="1">DRUM</text>
<text x="52" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" letter-spacing="1">AND</text>
<text x="52" y="132" font-family="Arial, Helvetica, sans-serif" font-size="36" letter-spacing="1">STONE</text>
</svg>
</a>
<nav>
<a href="shop.html">Shop</a>
<div class="goods"><button type="button">Goods</button>
<div class="panel">
<a href="shop.html#coffee">Coffee</a>
<a href="shop.html#chocolate">Chocolate</a>
<a href="shop.html#beef">Beef</a>
<a href="shop.html#fruit">Dried fruit</a>
<a href="shop.html#noodles">Dry noodles</a>
</div></div>
</nav>
</header>
<main>
<p class="place">SOUTH FORK, PENNSYLVANIA</p>
<h1>Coffee, chocolate, and food for the pack.</h1>
<p class="lede">Small-batch goods from South Fork. Made to carry.</p>
<section class="grid" id="goods">
<a href="shop.html#coffee"><img src="images/coffee.jpg" alt="Roasted coffee"></a>
<a href="shop.html#chocolate"><img src="images/cacao.jpg" alt="Chocolate"></a>
<a href="shop.html#beef"><img src="images/jerky.jpg" alt="Beef"></a>
<a href="shop.html#fruit"><img src="images/fruit.jpg" alt="Dried fruit"></a>
<a href="shop.html#noodles"><img src="images/noodles.jpg" alt="Dry noodles"></a>
</section>
</main>
<script>document.querySelector('.goods button').onclick=function(){this.parentNode.classList.toggle('open')}</script>
</body>
</html>
